<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark light" />
    <title>Gemini Chat Page</title>
    <meta
      name="description"
      content="A static Gemini chat page for GitHub Pages."
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="bg-orb bg-orb-a"></div>
    <div class="bg-orb bg-orb-b"></div>

    <main class="shell">
      <section class="panel">
        <header class="hero">
          <div>
            <p class="eyebrow">Gemini Web Chat</p>
            <h1>Talk to Gemini in your browser</h1>
            <p class="subtitle">
              A static chat page ready for GitHub Pages. Your API key stays in
              your browser's local storage.
            </p>
          </div>

          <div class="status-card">
            <span class="status-dot" id="statusDot"></span>
            <span id="statusText">Not connected</span>
          </div>
        </header>

        <section class="controls">
          <label class="field">
            <span>GAS Web App URL</span>
            <input
              id="proxyUrl"
              type="url"
              placeholder="Paste your Apps Script web app URL"
              autocomplete="off"
              spellcheck="false"
            />
          </label>

          <label class="field">
            <span>API Key</span>
            <input
              id="apiKey"
              type="password"
              placeholder="Paste your Gemini API key"
              autocomplete="off"
              spellcheck="false"
            />
          </label>

          <label class="field">
            <span>Model</span>
            <select id="model">
              <option value="gemini-2.5-flash">gemini-2.5-flash</option>
              <option value="gemini-2.5-pro">gemini-2.5-pro</option>
              <option value="gemini-2.0-flash">gemini-2.0-flash</option>
            <option value="gemini-flash-latest">gemini-flash-latest</option>
            <option value="gemini-pro-latest">gemini-pro-latest</option>
          </select>
          </label>

          <button class="ghost" id="toggleKey" type="button">Show / hide</button>
          <button class="ghost" id="clearChat" type="button">Clear chat</button>
        </section>

        <section class="chat" id="chat" aria-live="polite" aria-label="Chat log">
          <article class="message assistant">
            <div class="bubble">
              Enter an API key, then start chatting.
            </div>
          </article>
        </section>

        <form class="composer" id="composer">
          <textarea
            id="prompt"
            rows="3"
            placeholder="Type a message. Enter to send, Shift+Enter for a new line."
          ></textarea>
          <button id="sendBtn" type="submit">Send</button>
        </form>

        <footer class="footer">
          <span>
            Tip: for GitHub Pages, keep your key restricted and stored locally.
          </span>
        </footer>
      </section>
    </main>

    <script src="app.js"></script>
  </body>
</html>
